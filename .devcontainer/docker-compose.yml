# Codespaces: PHP app + MySQL (matches upstream/main)
services:
  app:
    image: mcr.microsoft.com/devcontainers/php:8.2
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/workspaces/tadreeblms
    command: sleep infinity
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: tadreeblms
      DB_USERNAME: root
      DB_PASSWORD: secret

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: tadreeblms
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
